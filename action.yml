name: Skill Lint
description: >
  Structural linter for Claude Code skills. Catches the failures that are
  silent at install time and confusing later — a name that does not match its
  folder, an empty description, a skill with no procedure or no stopping rule,
  and duplicate leaf names that shadow each other in the flat install namespace.
author: Damien Dagnet
branding:
  icon: check-square
  color: purple

inputs:
  path:
    description: Directory holding the skills to lint (each skill is a folder with a SKILL.md, plain or grouped one level deep).
    required: false
    default: skills
  harness-ref:
    description: Commit of damson/agent-config-harness to run the linter from. Pinned so a harness change cannot silently change what this action enforces.
    required: false
    default: f0119ea6c34f0524f5278192af8dedb7f50a079a

runs:
  using: composite
  steps:
    - name: Fetch the linter at its pinned commit
      shell: bash
      env:
        HARNESS_REF: ${{ inputs.harness-ref }}
      run: '"$GITHUB_ACTION_PATH/bin/fetch-harness.sh" "$HARNESS_REF" "$RUNNER_TEMP/agent-config-harness"'

    - name: Lint the skills tree
      shell: bash
      env:
        SKILLS_PATH: ${{ inputs.path }}
      run: '"$GITHUB_ACTION_PATH/bin/run-lint.sh" "$RUNNER_TEMP/agent-config-harness" "$SKILLS_PATH"'
