name: ci
on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install bats
        run: sudo apt-get update -q && sudo apt-get install -y -q bats
      - name: Run the suite
        run: bats tests/

  good-tree-passes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          path: tests/fixtures/good

  bad-tree-must-fail:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prove the pinned harness ref is fetchable, so a failure below means lint
        run: |
          set -euo pipefail
          ref="$(awk '/harness-ref:/{f=1} f && /default:/{print $2; exit}' action.yml)"
          ./bin/fetch-harness.sh "$ref" "$RUNNER_TEMP/canary"
      - name: Prove the README's sample failure is what the pinned linter prints
        run: ./bin/check-readme-sample.sh "$RUNNER_TEMP/canary"
      - id: lint
        continue-on-error: true
        uses: ./
        with:
          path: tests/fixtures/bad
      - name: Assert the linter failed
        run: |
          if [ "${{ steps.lint.outcome }}" != "failure" ]; then
            echo "::error::The linter passed a tree it must reject"
            exit 1
          fi
