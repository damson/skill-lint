name: ci
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  good-tree-passes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          path: tests/fixtures/good
          token: ${{ secrets.HARNESS_TOKEN }}

  bad-tree-must-fail:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prove the harness is reachable, so a failure below means lint
        env:
          HARNESS_TOKEN: ${{ secrets.HARNESS_TOKEN }}
        run: |
          set -euo pipefail
          auth_args=()
          if [ -n "$HARNESS_TOKEN" ]; then
            auth=$(printf 'x-access-token:%s' "$HARNESS_TOKEN" | base64 | tr -d '\n')
            auth_args=(-c "http.extraheader=AUTHORIZATION: basic $auth")
          fi
          git "${auth_args[@]+"${auth_args[@]}"}" ls-remote \
            https://github.com/damson/agent-config-harness HEAD >/dev/null
      - id: lint
        continue-on-error: true
        uses: ./
        with:
          path: tests/fixtures/bad
          token: ${{ secrets.HARNESS_TOKEN }}
      - name: Assert the linter failed
        run: |
          if [ "${{ steps.lint.outcome }}" != "failure" ]; then
            echo "::error::The linter passed a tree it must reject"
            exit 1
          fi
