name: Harness pin

# The pin is what makes this action trustworthy: consumers run the linter at a
# commit somebody reviewed, and an upstream change cannot alter what their build
# enforces. It is also what rots, because a stale pin behaves exactly like a
# current one. This one sat three weeks and five upstream releases behind, and a
# person found it rather than a check.
#
# So the comparison runs on a schedule, and this opens a pull request. A
# regular bump, one inside the same major version whose findings on the bad
# fixtures are unchanged, is set to auto-merge once the required checks pass;
# anything else waits for a person. The upstream promotes to its default
# branch only when it cuts a release, so one pull request here is one release
# there.
#
# The schedule is the trigger of last resort, and it is a poor one: the event
# that should cause this work happens in another repository, and GitHub delays
# and drops cron. `repository_dispatch` is here so the upstream can push the
# event the moment it releases, once it holds a token that can reach this repo.

permissions:
  contents: write
  pull-requests: write

on:
  schedule:
    - cron: '23 7 * * *'   # daily, off the hour
  workflow_dispatch:
  repository_dispatch:
    types: [harness-release]

concurrency:
  group: harness-pin
  cancel-in-progress: false

jobs:
  bump:
    name: Follow the upstream release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A person's token, not GITHUB_TOKEN: a pull request GitHub attributes to
      # Actions raises no `pull_request` runs, so it would arrive with none of
      # the checks that are the entire reason to review a pin bump. The same
      # token pushes, because a refresh is attributed to whoever pushed.
      - name: Check the publishing token is present
        env:
          PIN_BUMP_TOKEN: ${{ secrets.PIN_BUMP_TOKEN }}
        run: |
          if [ -z "$PIN_BUMP_TOKEN" ]; then
            echo "::error::PIN_BUMP_TOKEN is not set. This opens a pull request, and one opened by Actions never gets the checks that justify merging it. Create a fine-grained PAT scoped to this repository with Contents: read and write and Pull requests: read and write, then: gh secret set PIN_BUMP_TOKEN"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ secrets.PIN_BUMP_TOKEN }}

      - name: Compare the pin with the upstream's latest release
        id: bump
        env:
          GH_TOKEN: ${{ secrets.PIN_BUMP_TOKEN }}
        run: ./bin/bump-harness-pin.sh

      - name: Install bats
        if: success() && steps.bump.outputs.changed == 'true'
        run: sudo apt-get update -q && sudo apt-get install -y -q bats

      # The suite tests this repository's scripts against stand-ins; it does
      # not run the upstream linter. The next step does.
      - name: Run the suite at the new pin
        if: success() && steps.bump.outputs.changed == 'true'
        run: bats tests/

      # The bump is a proposal about what this action enforces, so it arrives
      # having been run: the linter at the new pin lints the bad fixtures, and
      # its output becomes the README's sample failure. A bump to a broken
      # commit fails here, and one that rewords a finding arrives with the
      # README already saying the new words, where the diff shows them. One
      # that adds or drops a finding (exit 2) still opens, with the README
      # untouched, so its own README check is red until a person describes
      # the change on the branch.
      - name: Rewrite the README's sample failure at the new pin
        id: readme
        if: success() && steps.bump.outputs.changed == 'true'
        env:
          LATEST: ${{ steps.bump.outputs.latest }}
        run: |
          set -euo pipefail
          ./bin/fetch-harness.sh "$LATEST" "$RUNNER_TEMP/harness"
          status=0
          ./bin/check-readme-sample.sh --write "$RUNNER_TEMP/harness" || status=$?
          if [ "$status" -eq 2 ]; then
            echo "::warning::The linter's findings changed; the bump opens with the README sample for a person to update."
            echo "findings_unchanged=false" >> "$GITHUB_OUTPUT"
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          else
            echo "findings_unchanged=true" >> "$GITHUB_OUTPUT"
          fi

      # A branch that already exists is left alone: it is this same release's
      # bump, and anything pushed onto it since is a person's fix to it.
      - name: Open or refresh the pull request
        if: success() && steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PIN_BUMP_TOKEN }}
          TAG: ${{ steps.bump.outputs.tag }}
          CURRENT: ${{ steps.bump.outputs.current }}
          LATEST: ${{ steps.bump.outputs.latest }}
          SAME_MAJOR: ${{ steps.bump.outputs.same_major }}
          FINDINGS_UNCHANGED: ${{ steps.readme.outputs.findings_unchanged }}
        run: |
          set -euo pipefail
          branch="chore/harness-pin-${TAG}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "$branch already exists; leaving its commits alone."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -b "$branch"
            git add action.yml README.md
            git commit -m "Pin the linter to the harness at ${TAG}

          ${CURRENT} -> ${LATEST}

          Opened by the harness-pin workflow. The linter at the new pin linted
          the bad fixtures before this was pushed, and its output is the
          README's sample failure."
            git push -u origin "$branch"
          fi
          existing=$(gh pr list --base main --head "$branch" --state open --json number --jq '.[0].number // empty')
          body="The upstream cut \`${TAG}\`, so the linter this action runs moved.

          \`harness-ref\`: \`${CURRENT}\` to \`${LATEST}\`.

          The linter at the new pin linted the bad fixtures before this was
          opened, and the README's sample failure is its output: a change there
          is the upstream rewording a finding. What this cannot tell you is
          whether the new checks are ones you want enforced on everyone
          consuming this action, or whether the README's prose still describes
          them, so read the upstream's release notes before merging."
          if [ "$SAME_MAJOR" = true ] && [ "$FINDINGS_UNCHANGED" = true ]; then
            body="${body}

          This is a regular bump: the same major version upstream, and the
          same findings on the bad fixtures. It merges itself once the required
          checks pass, unless you turn auto-merge off on this pull request."
          else
            body="${body}

          This one waits for a person: it is a new major version upstream, or
          the linter's findings on the bad fixtures changed (same major:
          ${SAME_MAJOR}, same findings: ${FINDINGS_UNCHANGED:-false})."
          fi
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body "$body"
          else
            gh pr create --base main --head "$branch" \
              --title "Pin the linter to the harness at ${TAG}" --body "$body"
          fi

      # Auto-merge waits only for the checks main requires. With none required
      # it would merge at once, before CI had run, so that case is left for a
      # person rather than trusted.
      - name: Let a regular bump merge itself once CI passes
        if: success() && steps.bump.outputs.changed == 'true' && steps.bump.outputs.same_major == 'true' && steps.readme.outputs.findings_unchanged == 'true'
        env:
          GH_TOKEN: ${{ secrets.PIN_BUMP_TOKEN }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -euo pipefail
          required=$(gh api "repos/${GITHUB_REPOSITORY}/rules/branches/main" --jq '[.[] | select(.type == "required_status_checks")] | length')
          if [ "$required" -eq 0 ]; then
            echo "::warning::main requires no status checks, so auto-merge would not wait for CI. This bump waits for a person."
            exit 0
          fi
          pr=$(gh pr list --base main --head "chore/harness-pin-${TAG}" --state open --json number --jq '.[0].number // empty')
          [ -n "$pr" ] || { echo "::error::No open pull request for chore/harness-pin-${TAG}"; exit 1; }
          gh pr merge "$pr" --auto --squash
