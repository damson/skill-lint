name: Coverage

# kcov measures the bats suite's line coverage of bin/ and hands the result
# to Codecov, which owns the PR comment and the README badge. Informational
# only — codecov.yml marks every status non-blocking; ci.yml stays the gate.
permissions:
  contents: read
  id-token: write

on:
  pull_request:
  # Both long-lived branches, because Codecov diffs a pull request against a
  # report for its BASE commit and both branches are bases here: features
  # target develop, the release targets main. Measuring only develop leaves the
  # release pull request with nothing to subtract from, so it reports a bare
  # figure and no delta on the one pull request whose subject is how far the
  # release moves it.
  push:
    branches: [develop, main]

concurrency:
  group: coverage-${{ github.ref }}
  # A superseded pull request run is waste, but a superseded push to a
  # long-lived branch takes the base upload with it, and Codecov then has
  # nothing to diff the next pull request against.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install bats
        run: sudo apt-get update -q && sudo apt-get install -y -q bats

      # Ubuntu 24.04 carries no kcov package; build a pinned release once and
      # let the cache make every later run a no-op.
      - name: Restore kcov from cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/kcov
          key: kcov-43-${{ runner.os }}-noble

      - name: Build kcov if the cache missed
        timeout-minutes: 10
        run: .github/install-kcov.sh

      - name: Run the suite under kcov
        run: |
          set -euo pipefail
          "$HOME/.local/kcov/bin/kcov" \
               --include-path="$PWD/bin" \
               --bash-parse-files-in-dir="$PWD/bin" \
               --exclude-pattern=/tests/ \
               coverage-out "$(command -v bats)" tests/
          xml="coverage-out/kcov-merged/cobertura.xml"
          if [ ! -f "$xml" ]; then
            xml=$(find coverage-out -maxdepth 2 -name cobertura.xml | sort | head -1)
          fi
          if [ -z "$xml" ] || [ ! -f "$xml" ]; then
            echo "::error::kcov produced no cobertura.xml — tree follows"
            find coverage-out -maxdepth 3 | head -40
            exit 1
          fi
          echo "COBERTURA=$xml" >> "$GITHUB_ENV"

      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ${{ env.COBERTURA }}
          # Without this the uploader also auto-collects anything whose name
          # matches its search patterns and reports it as coverage.
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false
